<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6f5ef">
<title>Porto buses live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #0f3d3e; --text: #22302f; --muted: #6f8482; --line: #e3eeec; --field: #f3f8f7;
    --surface: #fff; --orange: #f7943a; --orange-soft: #fde8d3;
    --mint-1: #c4f0ea; --mint-2: #ecfbf6; --teal: #14645f;
    --shadow: 0 10px 30px rgba(15, 61, 62, 0.14);
    --sheet-h: 0px;
  }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: linear-gradient(160deg, #e3f7ef, #c9f1f2); overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button, select, input { font-family: inherit; }
  #map { position: fixed; inset: 0; background: #eef5f4; }
  /* A paler, calmer map so the route and buses stand out. */
  .leaflet-tile-pane { filter: grayscale(0.6) brightness(1.07) contrast(0.9); }

  header {
    position: fixed; z-index: 1000; left: 12px; right: 12px;
    top: calc(12px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px;
    border-radius: 22px; background: var(--surface); box-shadow: var(--shadow);
  }
  header h1 {
    font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin: 0; flex: 1; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  select, header button { font-size: 14px; font-weight: 600; height: 38px; padding: 0 14px; border-radius: 19px; }
  header #lineButton {
    display: flex; align-items: center; gap: 4px; max-width: 42vw; padding-right: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: none;
  }
  header #lineButton span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header #lineButton[aria-expanded="true"] { background: var(--field); color: var(--ink); }
  #linePicker {
    position: fixed; z-index: 1100; left: 12px; right: 12px; max-height: 55vh; overflow-y: auto;
    padding: 12px; box-sizing: border-box; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow);
  }
  #linePicker[hidden] { display: none; }
  .picker-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 0 2px 10px; font-size: 14px; color: var(--ink);
  }
  .picker-head span { font-size: 12px; color: var(--muted); }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px; }
  .line-chip {
    display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 4px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
  }
  .line-chip b { font-size: 15px; }
  .line-chip small { font-size: 11px; color: var(--muted); }
  .line-chip.on { border-color: var(--teal); background: var(--teal); color: #fff; }
  .line-chip.on small { color: rgba(255, 255, 255, 0.8); }
  .line-chip.all { width: 100%; flex-direction: row; justify-content: space-between; padding: 9px 12px; margin-bottom: 8px; }
  header button { border: 0; background: var(--orange); color: #fff; box-shadow: 0 4px 12px rgba(247, 148, 58, 0.35); }
  header button[aria-expanded="true"] { background: var(--orange-soft); color: #b45f12; box-shadow: none; }

  #status {
    position: fixed; z-index: 999; left: 16px; top: calc(78px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 500; color: var(--muted); background: var(--surface);
    box-shadow: 0 4px 12px rgba(15, 61, 62, 0.12);
  }
  #status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #2bb673; }
  #count { color: var(--ink); font-weight: 700; }
  #status.error { color: #fff; background: #d64545; }
  #status.error #count { color: #fff; }
  #status.error::before { background: #fff; }

  #panel {
    position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; box-sizing: border-box;
    max-height: 56vh; display: flex; flex-direction: column; gap: 10px;
    padding: 18px 16px calc(14px + env(safe-area-inset-bottom));
    border-radius: 28px 28px 0 0; background: var(--surface);
    box-shadow: 0 -10px 30px rgba(15, 61, 62, 0.14);
  }
  #panel[hidden] { display: none; }
  #panel > * { flex: none; }
  #panel input {
    width: 100%; box-sizing: border-box; font-size: 16px; font-weight: 500; height: 46px;
    padding: 0 16px; border: 1px solid var(--line); border-radius: 16px; outline: none;
    background: var(--field); color: var(--ink);
  }
  #panel input::placeholder { color: var(--muted); font-weight: 400; }
  #panel input:focus { border-color: var(--orange); background: var(--surface); }
  #panel [hidden] { display: none !important; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: var(--field); }
  .tabs button {
    flex: 1; height: 36px; padding: 0 4px; border: 0; border-radius: 12px; background: none;
    font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap;
  }
  .tabs button[aria-selected="true"] {
    color: var(--ink); background: var(--surface); box-shadow: 0 2px 6px rgba(15, 61, 62, 0.12);
  }
  #tripForm { display: flex; gap: 8px; }
  #tripForm input { flex: 1; min-width: 0; }
  #tripForm button[type="submit"] { width: 52px; padding: 0; display: grid; place-items: center; }
  #stopList {
    list-style: none; margin: 0; padding: 0; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--line); background: var(--surface);
  }
  #stopList:empty { display: none; }
  #stopList button {
    width: 100%; text-align: left; font-size: 15px; font-weight: 600; padding: 10px 16px;
    border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink);
  }
  #stopList li:last-child button { border-bottom: 0; }
  #stopList small { display: block; margin-top: 1px; color: var(--muted); font-weight: 500; }
  #tripForm button {
    flex: none; height: 46px; padding: 0 16px; border: 0; border-radius: 16px;
    font-size: 15px; font-weight: 700; color: #fff; background: var(--orange);
    box-shadow: 0 4px 12px rgba(247, 148, 58, 0.35);
  }
  #panel > #arrivals { flex: 1 1 auto; min-height: 0; overflow-y: auto; font-size: 14px; }
  #arrivals:empty { display: none; }

  .headline {
    position: relative; border-radius: 20px; padding: 14px 50px 14px 16px; margin-bottom: 12px;
    font-size: 13px; font-weight: 500; line-height: 1.4; color: var(--teal);
    background: linear-gradient(135deg, var(--mint-1), var(--mint-2));
  }
  .headline b {
    display: block; font-size: 32px; font-weight: 700; line-height: 1.15;
    letter-spacing: -0.03em; margin-top: 2px; color: var(--ink);
  }
  .headline .close {
    position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; padding: 0;
    border-radius: 50%; border: 0; font-size: 13px; color: var(--ink); background: rgba(255, 255, 255, 0.85);
  }
  .note { margin: 2px 4px 10px; color: var(--muted); line-height: 1.5; }
  .fine { margin: 10px 4px 0; font-size: 12px; line-height: 1.5; color: var(--muted); }

  .arrival {
    display: flex; align-items: center; gap: 12px; box-sizing: border-box;
    padding: 12px 14px; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: 18px; background: var(--surface);
  }
  button.arrival { width: 100%; font-size: inherit; color: inherit; text-align: left; }
  .arrival .tag {
    min-width: 42px; text-align: center; font-weight: 700; color: #fff;
    border-radius: 10px; padding: 5px 6px; background: var(--teal);
  }
  .arrival .to {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 600; color: var(--ink);
  }
  .arrival .when { text-align: right; white-space: nowrap; color: var(--ink); }
  .arrival .when b { font-size: 15px; font-weight: 700; }
  .arrival .when small { color: var(--muted); display: block; font-weight: 500; }
  .arrival .go { color: var(--orange); font-weight: 700; font-size: 20px; }

  /* The pin stays put over the middle of the visible map while the map moves under it.
     Its zero-size box marks the exact spot the pin points at. */
  #centrePin {
    position: fixed; z-index: 900; width: 0; height: 0; pointer-events: none;
    left: 50%; top: calc((100% - var(--sheet-h)) / 2 + 36px);
  }
  #centrePin[hidden] { display: none; }
  #centrePin .dest-pin { position: absolute; left: -15px; top: -36px; width: 30px; height: 30px; }
  #centrePin::after {
    content: ""; position: absolute; left: -6px; top: -3px; width: 12px; height: 6px;
    border-radius: 50%; background: rgba(15, 61, 62, 0.35);
  }
  .soft-button.primary { color: #fff; background: var(--orange); box-shadow: 0 4px 12px rgba(247, 148, 58, 0.35); }

  .summary {
    display: grid; gap: 10px; padding: 12px 14px; margin-bottom: 12px;
    border: 1px solid var(--line); border-radius: 18px; background: var(--surface);
  }
  .summary .label {
    display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--muted);
  }
  .summary b { font-size: 15px; color: var(--ink); }
  .summary small { display: block; margin-top: 1px; color: var(--muted); }
  .section {
    margin: 14px 4px 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--muted);
  }
  .tags { display: flex; flex-direction: column; gap: 4px; }
  .place-chip {
    border: 1px solid var(--line); border-radius: 12px; padding: 7px 11px; margin: 6px 6px 0 0;
    font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface);
  }

  /* Trip results: two lines of text per card. */
  .trip .to { white-space: normal; }
  .trip .to small { display: block; margin-top: 2px; font-weight: 500; color: var(--muted); }
  .trip.idle { opacity: 0.7; }
  .soft-button {
    border: 0; border-radius: 14px; padding: 11px 16px; margin: 0 2px 8px;
    font-size: 14px; font-weight: 700; color: #b45f12; background: var(--orange-soft);
  }
  .start-dot {
    width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%;
    background: #fff; border: 5px solid var(--ink); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }
  .locate {
    width: 40px; height: 40px; display: grid; place-items: center; padding: 0;
    border: 0; border-radius: 14px; background: var(--surface); color: #2f7fe0;
    box-shadow: var(--shadow); cursor: pointer;
  }
  .locate.off { color: #aebcbb; }
  .me-dot {
    width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%;
    background: #2f7fe0; border: 3px solid #fff;
    box-shadow: 0 0 0 6px rgba(47, 127, 224, 0.22), 0 2px 6px rgba(0, 0, 0, 0.3);
  }
  .dest-pin {
    width: 24px; height: 24px; box-sizing: border-box; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg); background: var(--orange); border: 4px solid #fff;
    box-shadow: 0 3px 8px rgba(15, 61, 62, 0.4);
  }

  /* The stops ahead: a rail of dots on the left with one card per stop. */
  .stops { position: relative; padding-left: 30px; }
  .stops::before {
    content: ""; position: absolute; left: 9px; top: 24px; bottom: 32px; width: 2px;
    border-radius: 2px; background: linear-gradient(var(--orange), #dfe7e6 70px);
  }
  .stops .arrival { position: relative; }
  .arrival .dot {
    position: absolute; left: -27px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
    box-sizing: border-box; border-radius: 50%; border: 4px solid #dfe7e6; background: #aebcbb;
  }
  .stops .arrival:first-child .dot {
    left: -29px; width: 18px; height: 18px; margin-top: -9px;
    border: 5px solid var(--orange); background: #fff;
  }
  .arrival.chosen { border-color: transparent; background: linear-gradient(135deg, var(--mint-1), var(--mint-2)); }
  .arrival.chosen .dot { border-color: var(--orange-soft); background: var(--orange); }

  .bus { position: relative; width: 40px; height: 40px; }
  .bus .dir {
    position: absolute; inset: 0; display: flex; justify-content: center;
    transition: transform 0.5s;
  }
  .bus .dir::before {
    content: ""; width: 0; height: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-bottom: 9px solid var(--c);
  }
  .bus .pill {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    min-width: 26px; height: 26px; padding: 0 6px; box-sizing: border-box;
    border-radius: 13px; border: 2px solid #fff; background: var(--c); color: #fff;
    font-size: 11px; font-weight: 700; line-height: 22px; text-align: center;
    box-shadow: 0 4px 10px rgba(15, 61, 62, 0.3);
  }
  .bus.stale { opacity: 0.4; }
  .bus-dot {
    width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%;
    background: var(--c); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(15, 61, 62, 0.35);
  }
  .bus-dot.stale { opacity: 0.4; }
  .bus.tracked { --c: #f7943a !important; }
  .bus.tracked .pill { box-shadow: 0 0 0 5px rgba(247, 148, 58, 0.28), 0 4px 10px rgba(15, 61, 62, 0.3); }
  .stop-pin {
    width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%;
    background: #fff; border: 6px solid var(--ink); box-shadow: 0 3px 8px rgba(15, 61, 62, 0.4);
  }
  .stop-label {
    padding: 3px 9px; border-radius: 999px; border: 0;
    font-family: inherit; font-size: 11px; font-weight: 600; line-height: 1.35;
    color: var(--ink); white-space: nowrap; box-shadow: 0 3px 10px rgba(15, 61, 62, 0.2);
  }
  .stop-label::before { display: none; }
  .stop-label span {
    display: inline-block; max-width: 120px; overflow: hidden;
    text-overflow: ellipsis; vertical-align: bottom;
  }
  .stop-label b { margin-left: 6px; color: #d9741a; }
  .leaflet-container { font-family: inherit; }
  .leaflet-popup-content-wrapper { border-radius: 16px; box-shadow: var(--shadow); color: var(--ink); }

  /* Keep the map's own controls clear of the top bar and the bottom sheet. */
  .leaflet-top { top: calc(70px + env(safe-area-inset-top)); }
  .leaflet-bottom { bottom: var(--sheet-h); }
  .leaflet-bar { border: 0 !important; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .leaflet-bar a { color: var(--ink); }
  .leaflet-control-attribution { font-size: 10px; border-radius: 8px 0 0 0; }
  @media (pointer: coarse) { .leaflet-control-zoom { display: none; } }

  /* Phones: tighter spacing so the map keeps most of the screen. Text fields stay at 16px,
     because iPhones zoom the page in on smaller ones. */
  @media (max-width: 719px) {
    header {
      top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px;
      padding: 5px 5px 5px 12px; gap: 6px; border-radius: 18px;
    }
    header h1 { font-size: 15px; }
    select, header button { height: 32px; padding: 0 10px; font-size: 13px; border-radius: 16px; }
    #status { top: calc(56px + env(safe-area-inset-top)); left: 12px; padding: 3px 9px; font-size: 11px; }
    .leaflet-top { top: calc(52px + env(safe-area-inset-top)); }

    #panel {
      max-height: 40vh; gap: 7px; border-radius: 22px 22px 0 0;
      padding: 10px 10px calc(8px + env(safe-area-inset-bottom));
    }
    .tabs { padding: 3px; border-radius: 13px; }
    .tabs button { height: 28px; font-size: 12px; border-radius: 10px; }
    #panel input { height: 38px; padding: 0 12px; border-radius: 12px; }
    #tripForm { gap: 6px; }
    #tripForm button[type="submit"] { width: 44px; height: 38px; border-radius: 12px; }
    #stopList button { padding: 8px 12px; font-size: 14px; }
    #panel > #arrivals { font-size: 13px; }

    .headline { padding: 9px 40px 9px 12px; margin-bottom: 8px; border-radius: 16px; font-size: 12px; }
    .headline b { font-size: 24px; }
    .headline .close { top: 7px; right: 7px; width: 28px; height: 28px; }
    .summary { gap: 6px; padding: 8px 11px; margin-bottom: 8px; border-radius: 14px; }
    .summary b { font-size: 14px; }
    .summary .label { font-size: 10px; }
    .note { margin: 0 2px 8px; font-size: 12px; }
    .fine { margin-top: 6px; font-size: 11px; }
    .section { margin: 10px 2px 6px; font-size: 11px; }
    .soft-button { padding: 9px 13px; font-size: 13px; }

    .arrival { gap: 9px; padding: 8px 10px; margin-bottom: 6px; border-radius: 14px; }
    .arrival .tag { min-width: 34px; padding: 3px 4px; border-radius: 8px; font-size: 12px; }
    .arrival .when b { font-size: 14px; }
    .trip .to small, .arrival .when small { font-size: 11px; }
    .stops { padding-left: 26px; }
    .stops::before { left: 8px; }
    .arrival .dot { left: -24px; }
    .stops .arrival:first-child .dot { left: -26px; }
  }

  @media (min-width: 720px) {
    header { right: auto; width: 390px; box-sizing: border-box; }
    #panel { left: 12px; right: auto; bottom: 12px; width: 390px; max-height: 64vh; border-radius: 28px; box-shadow: var(--shadow); }
    .leaflet-bottom { bottom: 0; }
    #centrePin { top: 50%; left: calc(50% + 200px); }
    #linePicker { right: auto; width: 390px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<header>
  <h1>Porto buses</h1>
  <button type="button" id="lineButton" aria-haspopup="dialog" aria-expanded="false" aria-controls="linePicker">
    <span>All lines</span>
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
  </button>
  <button id="panelToggle" type="button" aria-expanded="false" aria-controls="panel">Search</button>
</header>
<div id="linePicker" role="dialog" aria-label="Choose a line" hidden></div>
<div id="centrePin" hidden><div class="dest-pin"></div></div>
<div id="status"><span id="count">Loading…</span><span id="updated"></span></div>
<section id="panel" hidden>
  <div class="tabs" role="tablist" aria-label="Search by">
    <button type="button" role="tab" data-mode="address" aria-selected="false">Address</button>
    <button type="button" role="tab" data-mode="pin" aria-selected="false">Pin</button>
    <button type="button" role="tab" data-mode="stop" aria-selected="false">Stop</button>
    <button type="button" role="tab" data-mode="bus" aria-selected="false">Bus / line</button>
  </div>
  <form id="tripForm" data-for="address">
    <input id="destInput" type="search" placeholder="Where to? Type an address" autocomplete="off" enterkeyhint="search" aria-label="Destination address">
    <button type="submit" aria-label="Find buses" title="Find buses">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 11h12.17l-5.58-5.59L12 4l8 8-8 8-1.41-1.41L16.17 13H4z"/></svg>
    </button>
  </form>
  <input id="stopInput" data-for="stop" type="search" placeholder="Stop name or code" autocomplete="off" aria-label="Stop name or code">
  <ul id="stopList" data-for="stop"></ul>
  <input id="busInput" data-for="bus" type="search" placeholder="Line or bus number, e.g. 205" autocomplete="off" aria-label="Line or bus number">
  <div id="arrivals"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Optional: address of the helper from worker.js, e.g. 'https://porto-buses.yourname.workers.dev'.
  // Without it the map, routes and stops all work, with times estimated from distance.
  // With it the app also uses STCP's live predictions and lists the buses due at a stop.
  const STCP_PROXY = 'PASTE-YOUR-WORKER-URL-HERE';

  const FEED_URL =
    'https://broker.fiware.urbanplatform.portodigital.pt/v2/entities' +
    '?q=vehicleType==bus&limit=1000&options=keyValues';
  const REFRESH_MS = 10000;
  const ARRIVALS_REFRESH_MS = 20000;
  const ROUTE_REFRESH_MS = 30000;
  const NEXT_STOPS = 5;
  const LABEL_OFFSET = { right: [7, 0], left: [-7, 0], top: [0, -7], bottom: [0, 7] };
  const STALE_MS = 3 * 60 * 1000;
  // Used only when STCP has no prediction for a bus: a typical city bus pace.
  const DEFAULT_MIN_PER_KM = 3.5;

  const proxyBase = /^https?:\/\//.test(STCP_PROXY) ? STCP_PROXY.replace(/\/+$/, '') : null;

  function annotation(list, prefix) {
    const hit = (list || []).find((a) => typeof a === 'string' && a.startsWith(prefix));
    return hit ? hit.slice(prefix.length) : null;
  }

  function simplify(entity) {
    const coords = entity.location && entity.location.coordinates;
    if (!coords) return null;
    return {
      id: String(entity.fleetVehicleId || entity.id),
      line: annotation(entity.annotations, 'stcp:route:') || '?',
      trip: annotation(entity.annotations, 'stcp:nr_viagem:'),
      dir: annotation(entity.annotations, 'stcp:sentido:'),
      lat: coords[1],
      lon: coords[0],
      heading: entity.heading ?? entity.bearing ?? null,
      speed: entity.speed ?? null,
      time: entity.observationDateTime || null,
    };
  }

  // Central Porto at street level until the user's position is known.
  const map = L.map('map', { zoomControl: false }).setView([41.1496, -8.6109], 15);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors | Bus data: STCP / Porto Digital',
  }).addTo(map);

  // The search sheet floats over the map. Its height is published to CSS so the map's
  // attribution stays visible above it.
  new ResizeObserver(() => {
    const h = document.getElementById('panel').offsetHeight;
    document.documentElement.style.setProperty('--sheet-h', h + 'px');
  }).observe(document.getElementById('panel'));

  // How much of the map is covered by the top bar and the sheet, for fitting things in view.
  function viewPadding(sides) {
    const sheet = document.getElementById('panel');
    const top = document.querySelector('header').getBoundingClientRect().bottom + 14;
    const wide = window.innerWidth >= 720;
    const covered = sheet.hidden ? 0 : sheet.offsetHeight;
    return {
      paddingTopLeft: [(wide && !sheet.hidden ? 410 : 20) + (sides || 0), top + (sides ? 20 : 0)],
      paddingBottomRight: [20 + (sides || 0), (wide ? 0 : covered) + 28 + (sides ? 20 : 0)],
    };
  }

  const markers = new Map();
  const lineButton = document.getElementById('lineButton');
  const linePicker = document.getElementById('linePicker');
  // Buses reporting on each line right now.
  let lineCounts = new Map();
  const statusEl = document.getElementById('status');
  const countEl = document.getElementById('count');
  const updatedEl = document.getElementById('updated');
  const panel = document.getElementById('panel');
  const panelToggle = document.getElementById('panelToggle');
  const busInput = document.getElementById('busInput');
  const arrivalsEl = document.getElementById('arrivals');
  const stopInput = document.getElementById('stopInput');
  const stopList = document.getElementById('stopList');
  const tripForm = document.getElementById('tripForm');
  const destInput = document.getElementById('destInput');

  function load(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
  function save(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  let selectedLine = load('line');
  let lastBuses = [];
  // Below this zoom, a crowded map shows buses as dots without labels.
  const DOT_ZOOM = 15;
  // Stops within this distance of the user count as "near you".
  const NEAR_RADIUS_M = 500;
  // Stops and lines near the user once their position is known.
  let nearMe = null;
  // Which search tab is open: address, pin, stop or bus.
  let mode = '';
  const MODE_HINTS = {
    address: 'Type an address and press Enter or the arrow to see the nearest stop and the fastest buses from where you are.',
    pin: '',
    stop: 'Start typing a stop name and pick it from the suggestions.',
    bus: 'Type a line, such as 205, or a bus number. You can also tap a bus on the map.',
  };

  const BUS_COLOR = '#14645f';
  const ROUTE_COLOR = '#f7943a';
  function colorFor() { return BUS_COLOR; }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => '&#' + c.charCodeAt(0) + ';');
  }

  function busQuery() { return busInput.value.trim().toUpperCase(); }

  function iconFor(bus, stale, tracked, compact) {
    if (compact) {
      return L.divIcon({
        className: '',
        iconSize: [12, 12],
        iconAnchor: [6, 6],
        html: '<div class="bus-dot' + (stale ? ' stale' : '') + '" style="--c:' + colorFor(bus.line) + '"></div>',
      });
    }
    const arrow = bus.heading == null ? '' :
      '<div class="dir" style="transform:rotate(' + Number(bus.heading) + 'deg)"></div>';
    return L.divIcon({
      className: '',
      iconSize: [40, 40],
      iconAnchor: [20, 20],
      html: '<div class="bus' + (stale ? ' stale' : '') + (tracked ? ' tracked' : '') +
        '" style="--c:' + colorFor(bus.line) + '">' +
        arrow + '<div class="pill">' + escapeHtml(bus.line) + '</div></div>',
    });
  }

  function ageText(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + ' s ago';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    return Math.round(s / 3600) + ' h ago';
  }

  function popupFor(bus, age) {
    return '<b>Line ' + escapeHtml(bus.line) + '</b><br>Bus ' + escapeHtml(bus.id) +
      (bus.speed != null ? '<br>Speed: ' + Math.round(bus.speed) + ' km/h' : '') +
      (age != null ? '<br>Position from ' + ageText(age) : '');
  }

  function updateLineOptions(buses) {
    const now = Date.now();
    lineCounts = new Map();
    for (const b of buses) {
      if (b.time && now - Date.parse(b.time) > STALE_MS) continue;
      lineCounts.set(b.line, (lineCounts.get(b.line) || 0) + 1);
    }
    // A saved line that has no buses running any more falls back to all lines.
    if (selectedLine && !buses.some((b) => b.line === selectedLine)) {
      selectedLine = '';
      save('line', '');
    }
    updateLineButton();
    if (!linePicker.hidden) renderLinePicker();
  }

  function updateLineButton() {
    lineButton.querySelector('span').textContent = selectedLine
      ? 'Line ' + selectedLine + ' · ' + (lineCounts.get(selectedLine) || 0) + ' live'
      : 'All lines';
  }

  function renderLinePicker() {
    const lines = [...lineCounts.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    const total = [...lineCounts.values()].reduce((sum, n) => sum + n, 0);
    linePicker.innerHTML =
      '<div class="picker-head"><b>Lines running now</b><span>' + total + ' buses live</span></div>' +
      '<button type="button" class="line-chip all' + (selectedLine ? '' : ' on') + '" data-line="">' +
      '<b>All lines</b><small>' + lines.length + ' lines</small></button>' +
      '<div class="chips">' + lines.map((l) =>
        '<button type="button" class="line-chip' + (l === selectedLine ? ' on' : '') + '" data-line="' + escapeHtml(l) + '">' +
        '<b>' + escapeHtml(l) + '</b><small>' + lineCounts.get(l) + ' live</small></button>').join('') + '</div>';
  }

  function setLinePicker(open) {
    linePicker.hidden = !open;
    lineButton.setAttribute('aria-expanded', String(open));
    if (open) {
      linePicker.style.top = (document.querySelector('header').getBoundingClientRect().bottom + 6) + 'px';
      renderLinePicker();
    }
  }

  // Glides a marker to its new position over a second. The position goes through Leaflet on
  // every frame, so zooming in the middle of a glide keeps the marker where it belongs.
  function slideTo(marker, to) {
    const from = marker.getLatLng();
    if (marker._slide) cancelAnimationFrame(marker._slide);
    marker._slide = null;
    if (document.hidden || (from.lat === to[0] && from.lng === to[1])) {
      marker.setLatLng(to);
      return;
    }
    const start = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - start) / 1000);
      marker.setLatLng([from.lat + (to[0] - from.lat) * k, from.lng + (to[1] - from.lng) * k]);
      marker._slide = k < 1 ? requestAnimationFrame(step) : null;
    };
    marker._slide = requestAnimationFrame(step);
  }

  // The lines that matter right now: the followed bus's line, the lines of a trip or stop
  // search, or with no search the lines that stop near the user. Null means show everything.
  function focusLines() {
    const q = busQuery();
    const followed = q && lastBuses.find((b) => b.id.toUpperCase() === q);
    if (followed) return new Set([followed.line]);
    if (trip && trip.results) {
      const lines = new Set();
      trip.results.found.forEach((r) => lines.add(r.option.line));
      trip.results.changes.forEach((c) => { lines.add(c.lineA); lines.add(c.lineB); });
      trip.results.idle.forEach((r) => lines.add(r.option.line));
      return lines.size ? lines : null;
    }
    if (trip) return null;
    if (stopView && stopLines) return new Set(linesAt(stopView.stop.id));
    if (!pinMode && !selectedLine && nearMe && nearMe.ready && nearMe.lines.size) return nearMe.lines;
    return null;
  }

  function render(buses) {
    const now = Date.now();
    const seen = new Set();
    const trackedId = busQuery();
    const typedLine = trackedId && buses.some((b) => b.line.toUpperCase() === trackedId) ? trackedId : '';
    const focus = typedLine ? null : focusLines();
    const shown = buses.filter((bus) => {
      // A bus the user follows stays visible whatever the filter.
      if (bus.id.toUpperCase() === trackedId) return true;
      if (typedLine) return bus.line.toUpperCase() === typedLine;
      if (focus) return focus.has(bus.line);
      return !selectedLine || bus.line === selectedLine;
    });
    const compactAll = map.getZoom() < DOT_ZOOM && shown.length > 30;
    let live = 0;
    for (const bus of shown) {
      const tracked = bus.id.toUpperCase() === trackedId;
      const compact = compactAll && !tracked;
      const age = bus.time ? now - Date.parse(bus.time) : null;
      const stale = age != null && age > STALE_MS;
      if (!stale) live++;
      seen.add(bus.id);
      const key = bus.line + '|' + bus.heading + '|' + stale + '|' + tracked + '|' + compact;
      let m = markers.get(bus.id);
      if (!m) {
        m = L.marker([bus.lat, bus.lon], { icon: iconFor(bus, stale, tracked, compact) }).addTo(map);
        m.bindPopup('');
        m.on('click', () => trackBus(bus.id));
        markers.set(bus.id, m);
      } else {
        slideTo(m, [bus.lat, bus.lon]);
        if (m._key !== key) m.setIcon(iconFor(bus, stale, tracked, compact));
      }
      m._key = key;
      m.setZIndexOffset(tracked ? 2000 : stale ? 0 : 1000);
      m.setPopupContent(popupFor(bus, age));
    }
    for (const [id, m] of markers) {
      if (!seen.has(id)) { map.removeLayer(m); markers.delete(id); }
    }
    const parked = seen.size - live;
    countEl.textContent = live + ' live' + (parked ? ' · ' + parked + ' idle' : '');
  }

  async function refresh() {
    try {
      const res = await fetch(FEED_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('feed returned HTTP ' + res.status);
      lastBuses = (await res.json()).map(simplify).filter(Boolean);
      updateLineOptions(lastBuses);
      render(lastBuses);
      syncRoute();
      statusEl.classList.remove('error');
      updatedEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch (err) {
      statusEl.classList.add('error');
      updatedEl.textContent = 'No data: ' + err.message;
    }
  }

  // ---- Stops and arrival times ----

  let stops = null;
  let stopsLoading = null;
  let selectedStop = null;
  let arrivals = null;
  let arrivalsError = '';
  let stopMarker = null;

  function loadStops() {
    if (stops) return Promise.resolve(stops);
    if (!stopsLoading) {
      stopsLoading = fetch('stops.json')
        .then((res) => {
          if (!res.ok) throw new Error('stop list returned HTTP ' + res.status);
          return res.json();
        })
        .then((rows) => {
          stops = rows.map(([id, name, lat, lon]) => ({ id, name, lat, lon }));
          return stops;
        })
        .catch((err) => { stopsLoading = null; throw err; });
    }
    return stopsLoading;
  }

  function selectStop(stop, moveMap) {
    selectedStop = stop;
    arrivals = null;
    arrivalsError = '';
    if (!stopMarker) {
      stopMarker = L.marker([stop.lat, stop.lon], {
        icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: '<div class="stop-pin"></div>' }),
        zIndexOffset: 3000,
      }).addTo(map);
    } else {
      stopMarker.setLatLng([stop.lat, stop.lon]);
    }
    stopMarker.bindPopup('<b>' + escapeHtml(stop.name) + '</b><br>Stop ' + escapeHtml(stop.id));
    if (moveMap) focusMap();
    renderArrivals();
    refreshArrivals();
    refreshAnchors();
  }

  function focusMap() {
    if (!selectedStop || routeView) return;
    const here = [selectedStop.lat, selectedStop.lon];
    map.fitBounds([here, here], Object.assign(viewPadding(), { maxZoom: Math.max(map.getZoom(), 16) }));
  }

  async function refreshArrivals() {
    if (!selectedStop || !proxyBase) return;
    const stopId = selectedStop.id;
    try {
      const res = await fetch(proxyBase + '/stops/' + encodeURIComponent(stopId) + '/realtime', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!selectedStop || selectedStop.id !== stopId) return;
      arrivals = data.arrivals || [];
      arrivalsError = '';
    } catch (err) {
      if (!selectedStop || selectedStop.id !== stopId) return;
      arrivalsError = err.message;
    }
    renderArrivals();
  }

  function minutesText(a) {
    const m = Math.round(Number(a.arrival_minutes));
    return m <= 0 ? 'now' : m + ' min';
  }

  function clockText(a) {
    const t = a.estimated_arrival_time || a.scheduled_arrival_time;
    const d = t ? new Date(t) : null;
    return d && !isNaN(d) ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  }

  function arrivalRow(a) {
    const bus = lastBuses.find((b) => b.trip && b.trip === a.trip_id);
    const inner = '<span class="tag">' + escapeHtml(a.route_short_name) + '</span>' +
      '<span class="to">' + escapeHtml(a.trip_headsign || '') + '</span>' +
      '<span class="when"><b>' + minutesText(a) + '</b><small>' + clockText(a) + '</small></span>';
    const style = ' style="--c:' + colorFor(a.route_short_name) + '"';
    return bus
      ? '<button type="button" class="arrival" data-bus="' + escapeHtml(bus.id) + '"' + style + '>' +
        inner + '<span class="go" aria-label="Show route">›</span></button>'
      : '<div class="arrival"' + style + '>' + inner + '</div>';
  }

  // ---- Stop search: suggestions while typing, then the buses heading to that stop ----

  let stopView = null;
  // For each stop code, the lines that call there and its position in their stop order.
  let stopLines = null;

  // Lower case without accents, so "sao joao" finds "SÃO JOÃO".
  function fold(text) {
    return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  async function loadStopLines() {
    const index = await loadLineIndex();
    if (!stopLines) {
      stopLines = new Map();
      for (const key of Object.keys(index)) {
        index[key].forEach((id, idx) => {
          if (!stopLines.has(id)) stopLines.set(id, []);
          stopLines.get(id).push({ key, idx, line: decodeURIComponent(key.slice(0, key.lastIndexOf('_'))), dir: Number(key.slice(key.lastIndexOf('_') + 1)) });
        });
      }
    }
    return index;
  }

  function linesAt(stopId) {
    return [...new Set((stopLines.get(stopId) || []).map((l) => l.line))]
      .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  }

  async function showSuggestions() {
    const q = fold(stopInput.value.trim());
    if (q.length < 2) { stopList.innerHTML = ''; return; }
    let all;
    try {
      [all] = await Promise.all([loadStops(), loadStopLines()]);
    } catch (err) {
      stopList.innerHTML = '';
      return;
    }
    if (q !== fold(stopInput.value.trim())) return;
    // Only stops a line actually calls at; names that start with the typed text come first.
    const hits = all.filter((st) => stopLines.has(st.id) && fold(st.name + ' ' + st.id).includes(q))
      .sort((a, b) => fold(b.name).startsWith(q) - fold(a.name).startsWith(q) ||
        a.name.localeCompare(b.name) || a.id.localeCompare(b.id))
      .slice(0, 6);
    stopList.innerHTML = hits.length
      ? hits.map((st) =>
        '<li><button type="button" data-id="' + escapeHtml(st.id) + '">' + escapeHtml(st.name) +
        '<small>' + escapeHtml(st.id) + ' · lines ' + escapeHtml(linesAt(st.id).join(', ')) + '</small></button></li>').join('')
      : '<li><button type="button" disabled>No stop matches<small>Try part of the name</small></button></li>';
  }

  async function openStop(stop) {
    clearTrip();
    destInput.value = '';
    busInput.value = '';
    save('bus', '');
    stopInput.value = stop.name;
    stopList.innerHTML = '';
    const view = stopView = { stop, index: null, routes: new Map(), ready: false, results: [] };
    render(lastBuses);
    syncRoute();
    selectStop(stop, true);
    try {
      view.index = await loadStopLines();
      await Promise.all((stopLines.get(stop.id) || []).map((l) =>
        loadRoute(l.line, l.dir).then((route) => view.routes.set(l.key, route)).catch(() => {})));
    } catch (err) {
      // Leaves the view with no routes; the panel then says nothing is on its way.
    }
    if (stopView !== view) return;
    view.ready = true;
    renderArrivals();
  }

  function closeStop() {
    stopView = null;
    selectedStop = null;
    stopInput.value = '';
    if (stopMarker) { map.removeLayer(stopMarker); stopMarker = null; }
  }

  // Live buses that have not reached the stop yet, soonest first.
  function stopBuses(view) {
    const now = Date.now();
    const found = [];
    for (const l of stopLines.get(view.stop.id) || []) {
      const route = view.routes.get(l.key);
      const at = route && route.stops[l.idx];
      if (!at) continue;
      for (const bus of lastBuses) {
        if (bus.line !== l.line) continue;
        const dir = directionOf(bus);
        const busKey = view.index[l.line + '_' + dir] ? l.line + '_' + dir : l.line + '_' + (1 - dir);
        if (busKey !== l.key) continue;
        if (bus.time && now - Date.parse(bus.time) > STALE_MS) continue;
        const p = projectOnto(route, bus.lat, bus.lon, 0);
        if (p.d2 > 250 * 250 || p.dist > at.dist + 30) continue;
        found.push({
          bus,
          minutes: Math.round((at.dist - p.dist) / 1000 * DEFAULT_MIN_PER_KM),
          end: route.stops[route.stops.length - 1].name,
        });
      }
    }
    // A stop can appear twice on a circular line; keep each bus once, at its sooner time.
    found.sort((a, b) => a.minutes - b.minutes);
    const seen = new Set();
    return found.filter((r) => !seen.has(r.bus.id) && seen.add(r.bus.id)).slice(0, 8);
  }

  function renderStop() {
    const view = stopView;
    const title = 'Stop ' + escapeHtml(view.stop.name) + ' (' + escapeHtml(view.stop.id) + ')';
    const close = '<button type="button" class="close" data-clear-stop aria-label="Close this stop">✕</button>';
    if (!view.ready) {
      arrivalsEl.innerHTML = '<div class="headline">' + close + title + '</div><p class="note">Finding buses…</p>';
      return;
    }
    const rows = view.results = stopBuses(view);
    render(lastBuses);
    const lines = linesAt(view.stop.id);
    const first = rows[0];
    arrivalsEl.innerHTML = '<div class="headline">' + close + title +
      (first ? '<b>' + (first.minutes <= 0 ? 'now' : '~' + first.minutes + ' min') + '</b>next bus, line ' + escapeHtml(first.bus.line) : '') +
      '</div>' +
      (first ? '' : '<p class="note">No bus is on its way to this stop right now.</p>') +
      rows.map((r) =>
        '<button type="button" class="arrival trip" data-bus="' + escapeHtml(r.bus.id) + '">' +
        '<span class="tag">' + escapeHtml(r.bus.line) + '</span>' +
        '<span class="to">Bus ' + escapeHtml(r.bus.id) + '<small>towards ' + escapeHtml(r.end) + '</small></span>' +
        '<span class="when"><b>' + (r.minutes <= 0 ? 'now' : '~' + r.minutes + ' min') + '</b></span></button>').join('') +
      '<p class="fine">Lines at this stop: ' + escapeHtml(lines.join(', ') || 'none') +
      '. Only buses already on the road are shown, with rough times from distance.</p>';
  }

  // Where each line and direction ends, filled in as routes load.
  const lineEnds = new Map();

  function lineEnd(bus) {
    const dir = directionOf(bus);
    const key = bus.line + '|' + dir;
    if (!lineEnds.has(key)) {
      lineEnds.set(key, '');
      loadRoute(bus.line, dir)
        .then((route) => lineEnds.set(key, 'towards ' + route.stops[route.stops.length - 1].name))
        .catch(() => lineEnds.set(key, 'direction unknown'))
        .then(renderArrivals);
    }
    return lineEnds.get(key);
  }

  // The buses of the line the user typed, each a tap away from its route.
  function renderLine(q) {
    const buses = lastBuses.filter((b) => b.line.toUpperCase() === q)
      .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
    if (!buses.length) {
      arrivalsEl.innerHTML = '<p class="note">No line or bus "' + escapeHtml(q) + '" is running right now.</p>';
      return;
    }
    arrivalsEl.innerHTML = '<p class="note">Line ' + escapeHtml(buses[0].line) + ' has ' + buses.length +
      (buses.length === 1 ? ' bus' : ' buses') + ' running. Tap one to see its route and stop times.</p>' +
      buses.map((b) =>
        '<button type="button" class="arrival trip" data-bus="' + escapeHtml(b.id) + '">' +
        '<span class="tag">' + escapeHtml(b.line) + '</span>' +
        '<span class="to">Bus ' + escapeHtml(b.id) + '<small>' + escapeHtml(lineEnd(b) || 'finding direction…') + '</small></span>' +
        '<span class="go" aria-hidden="true">›</span></button>').join('');
  }

  function renderArrivals() {
    if (panel.hidden) return;
    const q = busQuery();
    const bus = q && lastBuses.find((b) => b.id.toUpperCase() === q);
    if (bus) { renderRoute(bus); return; }
    if (pinMode) {
      arrivalsEl.innerHTML = customOrigin
        ? '<p class="note">Starting point set. Now move the map until the pin sits on your destination.</p>' +
          '<button type="button" class="soft-button primary" data-pin="to">Find buses to this place</button>' +
          '<button type="button" class="soft-button" data-clear-origin>Start from my location instead</button>'
        : '<p class="note">Move the map until the pin sits on the place you want to go.</p>' +
          '<button type="button" class="soft-button primary" data-pin="to">Find buses to this place</button>' +
          '<button type="button" class="soft-button" data-pin="from">Start from here instead</button>';
      return;
    }
    if (trip) { renderTrip(); return; }

    if (q) { renderLine(q); return; }
    if (stopView) { renderStop(); return; }
    if (!proxyBase || !selectedStop) {
      arrivalsEl.innerHTML = nearMeCard() + '<p class="note">' + escapeHtml(MODE_HINTS[mode] || MODE_HINTS.address) + '</p>';
      return;
    }
    if (arrivalsError && !arrivals) {
      arrivalsEl.innerHTML = '<p class="note">Could not load arrival times: ' + escapeHtml(arrivalsError) + '</p>';
      return;
    }
    if (!arrivals) { arrivalsEl.innerHTML = '<p class="note">Loading arrival times…</p>'; return; }

    let rows = arrivals;
    let note = '';
    if (q) {
      rows = arrivals.filter((a) => String(a.route_short_name).toUpperCase() === q);
      if (!rows.length) {
        note = 'Nothing matching "' + q + '" is due at this stop. ' +
          'A bus number only shows up while that bus is in service.';
      }
    } else if (!rows.length) {
      note = 'No buses are due at this stop right now.';
    }
    arrivalsEl.innerHTML = (note ? '<p class="note">' + escapeHtml(note) + '</p>' : '') +
      rows.map(arrivalRow).join('') +
      (rows.some((a) => lastBuses.some((b) => b.trip && b.trip === a.trip_id))
        ? '<p class="fine">Tap a row marked › to follow that bus along its route.</p>' : '');
  }

  // ---- Route of the selected bus ----

  const routeCache = new Map();
  const routeLayer = L.layerGroup().addTo(map);
  let routeView = null;

  // Flat metres, accurate enough around Porto.
  function toXY(lat, lon) { return [lon * 83820, lat * 111200]; }

  // Nearest point on the route line, as metres travelled from the start of the route.
  function projectOnto(route, lat, lon, fromSeg) {
    const [px, py] = toXY(lat, lon);
    let best = { dist: 0, d2: Infinity, seg: fromSeg };
    for (let i = fromSeg; i < route.xy.length - 1; i++) {
      const [ax, ay] = route.xy[i];
      const dx = route.xy[i + 1][0] - ax;
      const dy = route.xy[i + 1][1] - ay;
      const len2 = dx * dx + dy * dy;
      const t = len2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2)) : 0;
      const d2 = (px - ax - t * dx) ** 2 + (py - ay - t * dy) ** 2;
      if (d2 < best.d2) best = { dist: route.cum[i] + t * Math.sqrt(len2), d2, seg: i };
    }
    return best;
  }

  function okJson(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  function bundledRoute(line, dir) {
    return fetch('routes/' + encodeURIComponent(encodeURIComponent(line)) + '_' + dir + '.json')
      .then(okJson)
      .then((data) => ({ coords: data.c, stopRows: data.s }));
  }

  function helperRoute(line, dir) {
    const base = proxyBase + '/route/' + encodeURIComponent(line);
    return Promise.all([
      fetch(base + '/shape?direction_id=' + dir).then(okJson),
      fetch(base + '/stops/direction?direction_id=' + dir).then(okJson),
    ]).then(([shape, list]) => {
      const coords = (shape.coordinates || []).map((c) => [c.lat, c.lng]);
      const stopRows = (list.stops || []).map((p) => [p.stop_id, p.stop_name, p.stop_lat, p.stop_lon]);
      if (coords.length < 2 || !stopRows.length) throw new Error('no route data');
      return { coords, stopRows };
    });
  }

  // Bundled file first, then the helper, then the other direction (circular lines have only one).
  function fetchRouteData(line, dir) {
    return bundledRoute(line, dir)
      .catch((err) => { if (!proxyBase) throw err; return helperRoute(line, dir); })
      .catch(() => bundledRoute(line, 1 - dir))
      .catch(() => { throw new Error('no route data for line ' + line); });
  }

  function loadRoute(line, dir) {
    const key = line + '|' + dir;
    if (!routeCache.has(key)) {
      const loading = fetchRouteData(line, dir).then(({ coords, stopRows }) => {
        const xy = coords.map((c) => toXY(c[0], c[1]));
        const cum = [0];
        for (let i = 1; i < xy.length; i++) {
          cum.push(cum[i - 1] + Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]));
        }
        const route = { coords, xy, cum };
        // Stops are in travel order, so each one is searched for from the previous one onwards.
        let seg = 0;
        route.stops = stopRows.map(([id, name, lat, lon]) => {
          const p = projectOnto(route, lat, lon, seg);
          seg = p.seg;
          return { id, name, lat, lon, dist: p.dist };
        });
        return route;
      });
      loading.catch(() => routeCache.delete(key));
      routeCache.set(key, loading);
    }
    return routeCache.get(key);
  }

  function directionOf(bus) {
    if (bus.dir === '0' || bus.dir === '1') return Number(bus.dir);
    const m = /^[^_]+_[0-9]+_([0-9])/.exec(bus.trip || '');
    return m && m[1] === '2' ? 1 : 0;
  }

  function clearRoute() {
    routeLayer.clearLayers();
    routeView = null;
  }

  function drawRoute(view) {
    const color = ROUTE_COLOR;
    const path = L.polyline(view.data.coords, { color, weight: 4, opacity: 0.95, lineCap: 'round', lineJoin: 'round' }).addTo(routeLayer);
    view.stopMarkers = view.data.stops.map((s) =>
      L.circleMarker([s.lat, s.lon], { radius: 5, weight: 2.5, color, fillColor: '#fff', fillOpacity: 1 })
        .bindPopup('')
        .bindTooltip('', { permanent: true, direction: 'right', offset: [7, 0], className: 'stop-label' })
        .addTo(routeLayer));
    view.bounds = path.getBounds();
  }

  async function syncRoute() {
    const q = busQuery();
    const bus = q ? lastBuses.find((b) => b.id.toUpperCase() === q) : null;
    if (!bus) { clearRoute(); renderArrivals(); return; }
    const dir = directionOf(bus);
    const key = bus.id + '|' + bus.line + '|' + dir;
    if (!routeView || routeView.key !== key) {
      clearRoute();
      const view = routeView = { key, busId: bus.id, line: bus.line, data: null, anchors: [], checked: false, error: '' };
      renderArrivals();
      try { view.data = await loadRoute(bus.line, dir); } catch (err) { view.error = err.message; }
      if (routeView !== view) return;
      if (view.data) { drawRoute(view); refreshAnchors(); }
    }
    updateRoute();
    // Fit only after the stop list is on screen, so the route clears the sheet.
    if (routeView && routeView.bounds && !routeView.fitted) {
      routeView.fitted = true;
      map.invalidateSize();
      // Extra room on the right, where the stop labels are drawn.
      // Zoom to the bus and its next few stops; the rest of the route stays drawn.
      const focus = nextStops(routeEtas(routeView, bus)).map((e) => [e.stop.lat, e.stop.lon]);
      focus.push([bus.lat, bus.lon]);
      map.fitBounds(focus, Object.assign(viewPadding(70), { maxZoom: 17 }));
    }
  }

  // Asks STCP when this bus is due at a few stops spread along the rest of its route.
  async function refreshAnchors() {
    const view = routeView;
    if (!view || !view.data) return;
    if (!proxyBase) { view.checked = true; return; }
    const bus = lastBuses.find((b) => b.id === view.busId);
    if (!bus) return;
    const pos = projectOnto(view.data, bus.lat, bus.lon, 0).dist;
    const ahead = view.data.stops.filter((s) => s.dist >= pos - 40);
    const sample = new Set();
    const n = Math.min(5, ahead.length);
    for (let i = 0; i < n; i++) sample.add(ahead[Math.round(i * (ahead.length - 1) / Math.max(1, n - 1))]);
    const chosen = selectedStop && ahead.find((s) => s.id === selectedStop.id);
    if (chosen) sample.add(chosen);
    const now = Date.now();
    const found = await Promise.all([...sample].map(async (s) => {
      try {
        const data = await fetch(proxyBase + '/stops/' + encodeURIComponent(s.id) + '/realtime', { cache: 'no-store' }).then(okJson);
        const hit = (data.arrivals || []).find((a) =>
          String(a.vehicle_id || '') === bus.id || (bus.trip && a.trip_id === bus.trip));
        return hit ? { dist: s.dist, at: now + Number(hit.arrival_minutes) * 60000 } : null;
      } catch (err) {
        return null;
      }
    }));
    if (routeView !== view) return;
    view.anchors = found.filter(Boolean).sort((a, b) => a.dist - b.dist);
    view.checked = true;
    updateRoute();
  }

  // Time to every stop: STCP's predictions where we have them, spread by distance in between.
  function routeEtas(view, bus) {
    const pos = projectOnto(view.data, bus.lat, bus.lon, 0).dist;
    const now = Date.now();
    const pts = [{ dist: pos, at: now }];
    for (const a of view.anchors) {
      const prev = pts[pts.length - 1];
      if (a.dist > prev.dist && a.at >= prev.at) pts.push(a);
    }
    const last = pts[pts.length - 1];
    const known = (last.dist - pos) / 1000;
    const pace = known > 0.2
      ? Math.max(1.5, Math.min(10, (last.at - now) / 60000 / known))
      : DEFAULT_MIN_PER_KM;
    return view.data.stops.map((stop) => {
      if (stop.dist < pos - 40) return { stop, passed: true };
      const d = Math.max(stop.dist, pos);
      const i = pts.findIndex((p) => p.dist >= d);
      let at;
      if (i === -1) at = last.at + (d - last.dist) / 1000 * pace * 60000;
      else if (i === 0) at = now;
      else at = pts[i - 1].at + (pts[i].at - pts[i - 1].at) * (d - pts[i - 1].dist) / (pts[i].dist - pts[i - 1].dist);
      return { stop, passed: false, minutes: Math.max(0, Math.round((at - now) / 60000)) };
    });
  }

  // Only the next few stops get a time, plus the stop the user picked if it is further on.
  function nextStops(etas) {
    const upcoming = etas.filter((e) => !e.passed);
    const shown = upcoming.slice(0, NEXT_STOPS);
    const mine = selectedStop && upcoming.find((e) => e.stop.id === selectedStop.id);
    if (mine && !shown.includes(mine)) shown.push(mine);
    return shown;
  }

  function etaText(e) { return e.minutes <= 0 ? 'now' : '~' + e.minutes + ' min'; }

  function updateRoute() {
    const view = routeView;
    const bus = view && lastBuses.find((b) => b.id === view.busId);
    if (view && view.data && bus) {
      const color = ROUTE_COLOR;
      // Labels are always on for the next few stops; where two would overlap on screen,
      // the later one is skipped so they stay readable. Zooming in brings it back.
      const etas = routeEtas(view, bus);
      const wanted = new Set(nextStops(etas));
      const placed = [];
      const labelled = new Map();
      const tryLabel = (i) => {
        const e = etas[i];
        if (!e || !wanted.has(e) || labelled.has(i)) return;
        const pt = map.latLngToContainerPoint(view.stopMarkers[i].getLatLng());
        // Approximate size of the label, tried on each side of the stop until one is free.
        const w = Math.min(e.stop.name.length * 6.6, 120) + etaText(e).length * 6.8 + 30;
        const sides = {
          right: { l: pt.x + 4, r: pt.x + 8 + w, t: pt.y - 13, b: pt.y + 13 },
          left: { l: pt.x - 8 - w, r: pt.x - 4, t: pt.y - 13, b: pt.y + 13 },
          top: { l: pt.x - w / 2, r: pt.x + w / 2, t: pt.y - 36, b: pt.y - 8 },
          bottom: { l: pt.x - w / 2, r: pt.x + w / 2, t: pt.y + 8, b: pt.y + 36 },
        };
        for (const side of Object.keys(sides)) {
          const box = sides[side];
          if (placed.some((p) => box.l < p.r && p.l < box.r && box.t < p.b && p.t < box.b)) continue;
          placed.push(box);
          labelled.set(i, side);
          return;
        }
      };
      // The stop the user picked gets its label first, then the rest in travel order.
      if (selectedStop) tryLabel(etas.findIndex((e) => e.stop.id === selectedStop.id));
      etas.forEach((e, i) => tryLabel(i));
      etas.forEach((e, i) => {
        const marker = view.stopMarkers[i];
        marker.setStyle(e.passed ? { color: '#b9c6c5', fillColor: '#eef3f2' } : { color, fillColor: '#fff' });
        marker.setPopupContent('<b>' + escapeHtml(e.stop.name) + '</b><br>' +
          (e.passed ? 'Bus ' + escapeHtml(bus.id) + ' already passed' : 'Bus ' + escapeHtml(bus.id) + ': ' + etaText(e)));
        if (labelled.has(i)) {
          const side = labelled.get(i);
          const tip = marker.getTooltip();
          tip.options.direction = side;
          tip.options.offset = L.point(LABEL_OFFSET[side]);
          marker.setTooltipContent('<span>' + escapeHtml(e.stop.name) + '</span><b>' + etaText(e) + '</b>');
          marker.openTooltip();
        } else {
          marker.closeTooltip();
        }
      });
    }
    renderArrivals();
  }

  function renderRoute(bus) {
    const view = routeView;
    const title = 'Bus ' + escapeHtml(bus.id) + ' · line ' + escapeHtml(bus.line);
    if (!view || (!view.data && !view.error)) {
      arrivalsEl.innerHTML = '<p class="note">' + title + ': loading its route…</p>';
      return;
    }
    if (view.error) {
      arrivalsEl.innerHTML = '<p class="note">' + title + ': could not load its route (' + escapeHtml(view.error) + ').</p>';
      return;
    }
    const etas = routeEtas(view, bus);
    const upcoming = etas.filter((e) => !e.passed);
    const shown = nextStops(etas);
    const end = view.data.stops[view.data.stops.length - 1];
    let headline = title + ' to ' + escapeHtml(end.name);
    let note = '';
    if (selectedStop) {
      const mine = etas.find((e) => e.stop.id === selectedStop.id);
      if (!mine) note = 'This bus does not stop at ' + selectedStop.name + ' (' + selectedStop.id + ') on its current trip.';
      else if (mine.passed) note = 'This bus has already passed ' + selectedStop.name + '.';
      else headline += '<b>' + etaText(mine) + '</b>until ' + escapeHtml(selectedStop.name);
    }
    const color = ROUTE_COLOR;
    arrivalsEl.innerHTML = '<div class="headline">' +
      '<button type="button" class="close" data-clear aria-label="Stop following this bus">✕</button>' +
      headline + '</div>' +
      (note ? '<p class="note">' + escapeHtml(note) + '</p>' : '') +
      '<div class="stops">' + shown.map((e) =>
        '<button type="button" class="arrival' + (selectedStop && selectedStop.id === e.stop.id ? ' chosen' : '') +
        '" data-stop="' + escapeHtml(e.stop.id) + '" style="--c:' + color + '">' +
        '<span class="dot"></span><span class="to">' + escapeHtml(e.stop.name) + '</span>' +
        '<span class="when"><b>' + etaText(e) + '</b></span></button>').join('') + '</div>' +
      '<p class="fine">' + (!proxyBase ? 'Rough estimates from the distance left and a typical bus pace.'
        : !view.checked ? 'Checking STCP predictions…'
        : view.anchors.length ? 'Based on STCP predictions for this bus; stops in between are estimated by distance.'
        : 'STCP has no prediction for this bus right now, so these are rough estimates from distance alone.') +
      (upcoming.length > shown.length
        ? ' Showing the next ' + Math.min(NEXT_STOPS, shown.length) + ' of ' + upcoming.length + ' stops left; tap a later stop on the map to see its time.'
        : '') + '</p>';
  }

  // ---- Trip search: direct buses from where the user is to an address ----

  const WALK_RADIUS_M = 600;
  // Straight-line metres covered per minute on foot, leaving room for corners and crossings.
  const WALK_M_PER_MIN = 65;
  const TOO_FAR_M = 3000;
  // Address search is limited to this box around Porto (west, north, east, south).
  const SEARCH_BOX = '-8.78,41.32,-8.45,41.03';
  const tripLayer = L.layerGroup().addTo(map);
  let trip = null;
  let lineIndex = null;
  // A starting point the user pinned by hand; used instead of the device's location.
  let customOrigin = null;
  let pinMode = false;

  function metres(aLat, aLon, bLat, bLon) {
    const a = toXY(aLat, aLon);
    const b = toXY(bLat, bLon);
    return Math.hypot(a[0] - b[0], a[1] - b[1]);
  }

  function walkMinutes(m) { return Math.max(1, Math.round(m / WALK_M_PER_MIN)); }

  // Which stops each line serves, in travel order: { "205_0": [stop ids], ... }.
  function loadLineIndex() {
    if (!lineIndex) {
      lineIndex = fetch('lines.json').then(okJson);
      lineIndex.catch(() => { lineIndex = null; });
    }
    return lineIndex;
  }

  function locate() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error('This browser cannot share its location.'));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (p) => {
          showMe(p);
          watchMe();
          resolve({ lat: p.coords.latitude, lon: p.coords.longitude });
        },
        (err) => reject(new Error(err.code === 1
          ? 'Location access was not allowed.'
          : 'Your location could not be found.')),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    });
  }

  function originMarker(o) {
    return L.marker([o.lat, o.lon], {
      icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: '<div class="start-dot"></div>' }),
      zIndexOffset: 2500,
    }).bindPopup('Your starting point');
  }

  function clearTrip() {
    trip = null;
    tripLayer.clearLayers();
    if (customOrigin) originMarker(customOrigin).addTo(tripLayer);
  }

  function beginTrip(query) {
    clearTrip();
    closeStop();
    const t = trip = {
      status: 'searching', query, message: '', places: [], dest: null,
      origin: customOrigin, originPinned: Boolean(customOrigin),
      index: null, options: [], routes: new Map(), results: null,
    };
    busInput.value = '';
    save('bus', '');
    render(lastBuses);
    syncRoute();
    return t;
  }

  // A trip to a point picked on the map, with no address lookup.
  function startTripTo(point) {
    destInput.value = '';
    const t = beginTrip('the pinned place');
    t.places = [{ lat: point.lat, lon: point.lon, label: 'the pinned place', detail: '' }];
    chooseDestination(t, 0);
  }

  function setOrigin(point) {
    customOrigin = { lat: point.lat, lon: point.lon };
    if (trip && trip.dest) {
      trip.origin = customOrigin;
      trip.originPinned = true;
      planTrip(trip);
    } else {
      tripLayer.clearLayers();
      originMarker(customOrigin).addTo(tripLayer);
      renderArrivals();
    }
  }

  async function startTrip(query) {
    const t = beginTrip(query);
    try {
      // The typed address goes to OpenStreetMap's search service. The user's location does not.
      const places = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5' +
        '&countrycodes=pt&bounded=1&viewbox=' + SEARCH_BOX + '&q=' + encodeURIComponent(query)).then(okJson);
      if (trip !== t) return;
      if (!places.length) {
        t.status = 'error';
        t.message = 'No place matching "' + query + '" was found in the Porto area.';
        renderArrivals();
        return;
      }
      t.places = places.map((p) => ({
        lat: Number(p.lat), lon: Number(p.lon),
        label: p.display_name.split(',').slice(0, 2).join(',').trim(),
        detail: p.display_name.split(',').slice(2, 5).join(',').trim(),
      }));
      // Go straight to the best match; the others are offered under the results.
      chooseDestination(t, 0);
    } catch (err) {
      if (trip !== t) return;
      t.status = 'error';
      t.message = 'The address search did not answer. Try again in a moment.';
      renderArrivals();
    }
  }

  async function chooseDestination(t, i) {
    t.dest = t.places[i];
    t.destIndex = i;
    if (!t.origin) {
      t.status = 'locating';
      renderArrivals();
      try {
        t.origin = await locate();
      } catch (err) {
        if (trip !== t) return;
        t.status = 'nolocation';
        t.message = err.message;
        drawTrip(t);
        renderArrivals();
        return;
      }
      if (trip !== t) return;
    }
    planTrip(t);
  }

  // Stops within walking distance of a point, or the three nearest when none are that close.
  function nearStops(all, lat, lon) {
    const ranked = all.map((stop) => ({ stop, m: metres(lat, lon, stop.lat, stop.lon) }))
      .sort((a, b) => a.m - b.m);
    const close = ranked.filter((r) => r.m <= WALK_RADIUS_M);
    return new Map((close.length ? close : ranked.slice(0, 3)).map((r) => [r.stop.id, r]));
  }

  async function planTrip(t) {
    t.status = 'planning';
    renderArrivals();
    try {
      const [all, index] = await Promise.all([loadStops(), loadLineIndex()]);
      if (trip !== t) return;
      t.index = index;
      const from = nearStops(all, t.origin.lat, t.origin.lon);
      const to = nearStops(all, t.dest.lat, t.dest.lon);
      if (Math.min(...[...from.values()].map((r) => r.m)) > TOO_FAR_M) {
        t.status = 'nolocation';
        t.message = 'You seem to be outside the area these buses cover.';
        drawTrip(t);
        renderArrivals();
        return;
      }
      // For each line and direction, the boarding and alighting stops with the least walking,
      // where boarding comes before alighting along the route.
      const options = [];
      for (const key of Object.keys(index)) {
        let board = null;
        let best = null;
        index[key].forEach((id, i) => {
          const off = to.get(id);
          if (off && board && (!best || board.m + off.m < best.walk)) {
            best = { walk: board.m + off.m, boardIdx: board.i, boardWalk: board.m, alightIdx: i, alightWalk: off.m };
          }
          const on = from.get(id);
          if (on && (!board || on.m < board.m)) board = { i, m: on.m };
        });
        if (best) {
          const cutAt = key.lastIndexOf('_');
          options.push(Object.assign({ key, line: decodeURIComponent(key.slice(0, cutAt)), dir: Number(key.slice(cutAt + 1)) }, best));
        }
      }
      options.sort((a, b) => a.walk - b.walk);
      t.options = options.slice(0, 12);
      t.transfers = planTransfers(index, all, from, to);
      const keys = new Set(t.options.map((o) => o.key));
      t.transfers.forEach((x) => { keys.add(x.a.key); keys.add(x.b.key); });
      await Promise.all([...keys].map((key) => {
        const { line, dir } = splitKey(key);
        return loadRoute(line, dir).then((route) => t.routes.set(key, route)).catch(() => {});
      }));
      if (trip !== t) return;
      // The stop nearest to the starting point, among stops a line actually calls at.
      await loadStopLines();
      if (trip !== t) return;
      t.nearest = null;
      for (const st of all) {
        if (!stopLines.has(st.id)) continue;
        const m = metres(t.origin.lat, t.origin.lon, st.lat, st.lon);
        if (!t.nearest || m < t.nearest.m) t.nearest = { stop: st, m };
      }
      if (t.nearest) selectStop(t.nearest.stop, false);
      t.status = 'ready';
      drawTrip(t);
      renderArrivals();
    } catch (err) {
      if (trip !== t) return;
      t.status = 'error';
      t.message = 'Could not load the route data (' + err.message + ').';
      renderArrivals();
    }
  }

  // How far apart two stops may be for a change of bus on foot.
  const TRANSFER_WALK_M = 200;

  function splitKey(key) {
    const cutAt = key.lastIndexOf('_');
    return { line: decodeURIComponent(key.slice(0, cutAt)), dir: Number(key.slice(cutAt + 1)) };
  }

  // Pairs of lines where one passes near the user, the other near the destination, and they
  // meet at a stop (or two stops a short walk apart) in the right order on both.
  function planTransfers(index, all, from, to) {
    const byId = new Map(all.map((st) => [st.id, st]));
    const starts = [];
    const ends = [];
    for (const key of Object.keys(index)) {
      let board = null;
      let alight = null;
      index[key].forEach((id, i) => {
        const on = from.get(id);
        if (on && (!board || on.m < board.m)) board = { i, m: on.m };
        const off = to.get(id);
        if (off && (!alight || off.m < alight.m)) alight = { i, m: off.m };
      });
      const line = splitKey(key).line;
      if (board) starts.push({ key, line, idx: board.i, walk: board.m });
      if (alight) ends.push({ key, line, idx: alight.i, walk: alight.m });
    }
    starts.sort((a, b) => a.walk - b.walk);
    ends.sort((a, b) => a.walk - b.walk);
    const found = [];
    for (const a of starts.slice(0, 15)) {
      for (const b of ends.slice(0, 15)) {
        if (a.line === b.line) continue;
        const aIds = index[a.key];
        const bIds = index[b.key];
        let best = null;
        for (let ia = a.idx + 1; ia < aIds.length; ia++) {
          const sa = byId.get(aIds[ia]);
          if (!sa) continue;
          for (let ib = 0; ib < b.idx; ib++) {
            const sb = byId.get(bIds[ib]);
            if (!sb) continue;
            const m = sa.id === sb.id ? 0 : metres(sa.lat, sa.lon, sb.lat, sb.lon);
            if (m > TRANSFER_WALK_M) continue;
            // Fewer stops on board and less walking is better.
            const score = (ia - a.idx) + (b.idx - ib) + m / 100;
            if (!best || score < best.score) best = { score, ia, ib, walk: m };
          }
        }
        if (best) found.push(Object.assign({ a, b }, best, { score: best.score + (a.walk + b.walk) / 100 }));
      }
    }
    found.sort((x, y) => x.score - y.score);
    return found.slice(0, 10);
  }

  // The soonest live bus on this line and direction that reaches the stop no earlier than
  // `notBefore` minutes from now (allowing `slack` minutes), or null.
  function nextBus(t, route, key, line, stop, notBefore, slack) {
    const now = Date.now();
    let best = null;
    for (const bus of lastBuses) {
      if (bus.line !== line) continue;
      const dir = directionOf(bus);
      const busKey = t.index[line + '_' + dir] ? line + '_' + dir : line + '_' + (1 - dir);
      if (busKey !== key) continue;
      if (bus.time && now - Date.parse(bus.time) > STALE_MS) continue;
      const p = projectOnto(route, bus.lat, bus.lon, 0);
      // Skip buses that are off the route (parked) or already past the stop.
      if (p.d2 > 250 * 250 || p.dist > stop.dist + 30) continue;
      const wait = (stop.dist - p.dist) / 1000 * DEFAULT_MIN_PER_KM;
      if (wait + slack < notBefore) continue;
      if (!best || wait < best.wait) best = { bus, wait };
    }
    return best;
  }

  // Rough minutes between buses on a line: one round trip (there and back) divided by the
  // number of its buses running in either direction.
  function headway(route, line) {
    const now = Date.now();
    const running = lastBuses.filter((bus) =>
      bus.line === line && !(bus.time && now - Date.parse(bus.time) > STALE_MS)).length;
    if (!running) return null;
    const roundTrip = 2 * route.cum[route.cum.length - 1] / 1000 * DEFAULT_MIN_PER_KM;
    return Math.max(3, Math.min(60, roundTrip / running));
  }

  // The bus to take from a stop: a live one if one is on its way and catchable, otherwise an
  // estimate from the line's frequency (for example at the first stop, before the bus leaves).
  // `notBefore` is when the user can be at the stop, in minutes from now.
  function busFrom(t, route, key, line, stop, notBefore, slack) {
    const live = nextBus(t, route, key, line, stop, notBefore, slack);
    if (live) return { bus: live.bus, wait: live.wait, estimated: false };
    const gap = headway(route, line);
    if (gap == null) return null;
    return { bus: null, wait: notBefore + gap / 2, estimated: true, gap };
  }

  function drawTrip(t) {
    tripLayer.clearLayers();
    const points = [];
    if (t.origin) {
      points.push([t.origin.lat, t.origin.lon]);
      if (t.originPinned) originMarker(t.origin).addTo(tripLayer);
    }
    if (t.dest) {
      points.push([t.dest.lat, t.dest.lon]);
      L.marker([t.dest.lat, t.dest.lon], {
        icon: L.divIcon({ className: '', iconSize: [24, 24], iconAnchor: [12, 26], html: '<div class="dest-pin"></div>' }),
        zIndexOffset: 2600,
      }).bindPopup('<b>' + escapeHtml(t.dest.label) + '</b>').addTo(tripLayer);
    }
    if (points.length) map.fitBounds(points, Object.assign(viewPadding(30), { maxZoom: 16 }));
  }

  // The live buses that can still be caught, fastest arrival first.
  function tripResults(t) {
    const found = [];
    const idle = [];
    for (const o of t.options) {
      const route = t.routes.get(o.key);
      const boardStop = route && route.stops[o.boardIdx];
      const alightStop = route && route.stops[o.alightIdx];
      if (!boardStop || !alightStop || alightStop.dist <= boardStop.dist) continue;
      const walkTo = walkMinutes(o.boardWalk);
      const walkFrom = walkMinutes(o.alightWalk);
      const ride = (alightStop.dist - boardStop.dist) / 1000 * DEFAULT_MIN_PER_KM;
      // The user must be able to walk to the stop before the bus gets there.
      const best = busFrom(t, route, o.key, o.line, boardStop, walkTo, 1);
      const base = { option: o, boardStop, alightStop, walkTo, walkFrom };
      if (best) {
        found.push(Object.assign(base, {
          bus: best.bus, wait: Math.round(best.wait), estimated: best.estimated, gap: best.gap && Math.round(best.gap),
          total: Math.round(best.wait + ride + walkFrom),
        }));
      } else {
        idle.push(base);
      }
    }
    found.sort((a, b) => a.total - b.total);
    // List each remaining line once, and only if it has no catchable bus above.
    const seen = new Set(found.map((r) => r.option.line));
    const quiet = [];
    for (const r of idle) {
      if (seen.has(r.option.line)) continue;
      seen.add(r.option.line);
      quiet.push(r);
    }
    // Trips with one change, shown when there is no direct bus or when they are faster.
    const changes = [];
    for (const x of t.transfers || []) {
      const ra = t.routes.get(x.a.key);
      const rb = t.routes.get(x.b.key);
      const board = ra && ra.stops[x.a.idx];
      const change = ra && ra.stops[x.ia];
      const next = rb && rb.stops[x.ib];
      const alight = rb && rb.stops[x.b.idx];
      if (!board || !change || !next || !alight || change.dist <= board.dist || alight.dist <= next.dist) continue;
      const walkTo = walkMinutes(x.a.walk);
      const walkFrom = walkMinutes(x.b.walk);
      const first = busFrom(t, ra, x.a.key, x.a.line, board, walkTo, 1);
      if (!first) continue;
      const walkChange = x.walk ? walkMinutes(x.walk) : 0;
      const ready = first.wait + (change.dist - board.dist) / 1000 * DEFAULT_MIN_PER_KM + walkChange;
      const second = busFrom(t, rb, x.b.key, x.b.line, next, ready, 0.5);
      if (!second) continue;
      const rideB = (alight.dist - next.dist) / 1000 * DEFAULT_MIN_PER_KM;
      changes.push({
        lineA: x.a.line, lineB: x.b.line, board, change, next, alight, walkTo, walkFrom, walkChange,
        bus: first.bus, wait: Math.round(first.wait), firstEstimated: first.estimated, gapA: first.gap && Math.round(first.gap),
        waitB: Math.round(Math.max(0, second.wait - ready)), estimated: second.estimated, gapB: second.gap && Math.round(second.gap),
        total: Math.round(second.wait + rideB + walkFrom),
      });
    }
    changes.sort((a, b) => a.total - b.total);
    const fastestDirect = found.length ? found[0].total : Infinity;
    const pairs = new Set();
    const shownChanges = [];
    for (const c of changes) {
      const pair = c.lineA + '>' + c.lineB;
      if (pairs.has(pair) || c.total >= fastestDirect) continue;
      pairs.add(pair);
      shownChanges.push(c);
    }
    return { found: found.slice(0, 5), idle: quiet.slice(0, 4), changes: shownChanges.slice(0, 3) };
  }

  function tripHeadline(t, big, small) {
    return '<div class="headline">' +
      '<button type="button" class="close" data-clear-trip aria-label="Close this search">✕</button>' +
      'To ' + escapeHtml(t.dest ? t.dest.label : t.query) + (t.originPinned ? ', from your pin' : '') +
      (big ? '<b>' + escapeHtml(big) + '</b>' : '') + escapeHtml(small || '') + '</div>';
  }

  // The nearest stop to the starting point, and the soonest bus among the ways to get there.
  function tripSummary(t, results) {
    const rows = [];
    if (t.nearest) {
      rows.push('<div><span class="label">Nearest stop</span><b>' + escapeHtml(t.nearest.stop.name) + '</b> · ' +
        walkMinutes(t.nearest.m) + ' min walk<small>Lines ' + escapeHtml(linesAt(t.nearest.stop.id).join(', ')) + '</small></div>');
    }
    const firstLegs = results.found.map((r) => ({ line: r.option.line, wait: r.wait, gap: r.gap, estimated: r.estimated, stop: r.boardStop }))
      .concat(results.changes.map((c) => ({ line: c.lineA, wait: c.wait, gap: c.gapA, estimated: c.firstEstimated, stop: c.board })));
    const live = firstLegs.filter((l) => !l.estimated).sort((a, b) => a.wait - b.wait)[0];
    const guess = firstLegs.filter((l) => l.estimated).sort((a, b) => a.gap - b.gap)[0];
    if (live) {
      rows.push('<div><span class="label">Next bus towards your destination</span><b>Line ' + escapeHtml(live.line) + ' ' +
        (live.wait <= 0 ? 'arriving now' : 'in ~' + live.wait + ' min') + '</b><small>at ' + escapeHtml(live.stop.name) + '</small></div>');
    } else if (guess) {
      rows.push('<div><span class="label">Next bus towards your destination</span><b>Line ' + escapeHtml(guess.line) +
        ', about every ' + guess.gap + ' min</b><small>at ' + escapeHtml(guess.stop.name) + '</small></div>');
    }
    return rows.length ? '<div class="summary">' + rows.join('') + '</div>' : '';
  }

  function renderTrip() {
    const t = trip;
    if (t.status === 'searching') { arrivalsEl.innerHTML = tripHeadline(t) + '<p class="note">Looking up the address…</p>'; return; }
    if (t.status === 'locating') { arrivalsEl.innerHTML = tripHeadline(t) + '<p class="note">Finding your location…</p>'; return; }
    if (t.status === 'planning') { arrivalsEl.innerHTML = tripHeadline(t) + '<p class="note">Finding buses…</p>'; return; }
    if (t.status === 'error') { arrivalsEl.innerHTML = tripHeadline(t) + '<p class="note">' + escapeHtml(t.message) + '</p>'; return; }
    if (t.status === 'nolocation') {
      arrivalsEl.innerHTML = tripHeadline(t) +
        '<p class="note">' + escapeHtml(t.message) + ' Move the map so your starting point is in the middle, then tap the button.</p>' +
        '<button type="button" class="soft-button" data-origin-centre>Start from the middle of the map</button>';
      return;
    }

    const results = t.results = tripResults(t);
    render(lastBuses);
    const first = results.found[0];
    const firstChange = results.changes[0];
    let html;
    if (first && (!firstChange || first.total <= firstChange.total)) {
      html = tripHeadline(t, '~' + first.total + ' min', 'fastest right now, on line ' + first.option.line);
    } else if (firstChange) {
      html = tripHeadline(t, '~' + firstChange.total + ' min',
        'fastest right now, line ' + firstChange.lineA + ' then ' + firstChange.lineB);
    } else {
      html = tripHeadline(t, '', '');
    }
    html += tripSummary(t, results);
    if (!first && !firstChange) {
      html += '<p class="note">' + (t.options.length || (t.transfers || []).length
        ? 'Buses go there, but none is on its way to your stop right now.'
        : 'No bus links the stops near you with the stops near that address, even with one change.') + '</p>';
    }
    const card = (followable, attrs, inner) => followable
      ? '<button type="button" class="arrival trip" ' + attrs + '>' + inner + '</button>'
      : '<div class="arrival trip">' + inner + '</div>';
    html += results.found.map((r, i) => card(!r.estimated, 'data-trip="' + i + '"',
      '<span class="tag">' + escapeHtml(r.option.line) + '</span>' +
      '<span class="to">' + escapeHtml(r.boardStop.name) + ' · ' + r.walkTo + ' min walk' +
      '<small>' + (r.estimated ? 'Bus about every ' + r.gap + ' min' : 'Bus ' + (r.wait <= 0 ? 'arriving now' : 'in ~' + r.wait + ' min')) +
      ' · get off at ' + escapeHtml(r.alightStop.name) + ' · ' + r.walkFrom + ' min walk</small></span>' +
      '<span class="when"><b>~' + r.total + ' min</b><small>in total</small></span>')).join('');
    if (results.changes.length) {
      html += '<p class="section">With one change</p>' + results.changes.map((c, i) => card(!c.firstEstimated, 'data-change="' + i + '"',
        '<span class="tags"><span class="tag">' + escapeHtml(c.lineA) + '</span><span class="tag">' + escapeHtml(c.lineB) + '</span></span>' +
        '<span class="to">' + escapeHtml(c.board.name) + ' · ' + c.walkTo + ' min walk' +
        '<small>' + (c.firstEstimated ? 'Bus about every ' + c.gapA + ' min' : 'Bus in ~' + c.wait + ' min') +
        ' · change at ' + escapeHtml(c.change.name) +
        (c.walkChange ? ' (' + c.walkChange + ' min walk to ' + escapeHtml(c.next.name) + ')' : '') +
