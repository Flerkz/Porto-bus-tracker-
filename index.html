        ' · line ' + escapeHtml(c.lineB) + ' ' + (c.estimated ? 'about every ' + c.gapB + ' min' : 'in ~' + c.waitB + ' min after you arrive') +
        ' · get off at ' + escapeHtml(c.alight.name) + '</small></span>' +
        '<span class="when"><b>~' + c.total + ' min</b><small>1 change</small></span>')).join('');
    }
    if (results.idle.length && (first || firstChange)) html += '<p class="section">No bus on the way</p>';
    html += results.idle.map((r) =>
      '<div class="arrival trip idle"><span class="tag">' + escapeHtml(r.option.line) + '</span>' +
      '<span class="to">' + escapeHtml(r.boardStop.name) + ' · ' + r.walkTo + ' min walk' +
      '<small>No bus on the way right now · get off at ' + escapeHtml(r.alightStop.name) + '</small></span></div>').join('');
    if (t.options.length || results.changes.length) {
      html += '<p class="fine">Fastest first; trips with one change are shown when they beat the direct buses. ' +
        'Tap one to follow its bus. Times are rough estimates from distance, walking is measured in a ' +
        'straight line, and "about every" means no bus is on its way yet, so the wait is guessed from how ' +
        'many buses the line has running.' +
        (mode === 'pin' ? ' Tap Pin again to choose another place.' : '') + '</p>';
    }
    // The other places the address search found, in case the first was not the one meant.
    const others = t.places.map((p, i) => ({ p, i })).filter(({ i }) => i !== t.destIndex);
    if (others.length) {
      html += '<p class="fine">Not the right place?</p><div>' + others.map(({ p, i }) =>
        '<button type="button" class="place-chip" data-place="' + i + '">' + escapeHtml(p.label) + '</button>').join('') + '</div>';
    }
    arrivalsEl.innerHTML = html;
  }

  // ---- Pin: a marker fixed mid-screen; the user slides the map under it, then confirms ----

  const centrePin = document.getElementById('centrePin');

  function setPinMode(on) {
    pinMode = on;
    centrePin.hidden = !on;
    if (on && panel.hidden) setPanel(true);
    renderArrivals();
  }

  // The map position under the tip of the fixed pin.
  function pinTarget() {
    const tip = centrePin.getBoundingClientRect();
    const frame = map.getContainer().getBoundingClientRect();
    const at = map.containerPointToLatLng([tip.left - frame.left, tip.top - frame.top]);
    return { lat: at.lat, lon: at.lng };
  }


  tripForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const query = destInput.value.trim();
    if (query.length < 3) return;
    destInput.blur();
    startTrip(query);
  });

  map.on('zoomend', () => {
    render(lastBuses);
    if (routeView) updateRoute();
  });

  // ---- The user's own position: a blue dot that follows them once location is in use ----

  let meMarker = null;
  let meCircle = null;
  let watchId = null;
  let centreOnFix = false;
  let centredOnUser = false;

  // Stops within walking distance of the user, the lines that call there, and their routes
  // so the next buses can be timed. Worked out again after the user moves 150 m.
  async function updateNearMe(lat, lon) {
    if (nearMe && metres(nearMe.lat, nearMe.lon, lat, lon) < 150) return;
    const here = { lat, lon, stops: [], lines: new Set(), routes: new Map(), index: null, ready: false };
    nearMe = here;
    try {
      const [all, index] = await Promise.all([loadStops(), loadStopLines()]);
      here.index = index;
      here.stops = all.filter((st) => stopLines.has(st.id))
        .map((st) => ({ stop: st, m: metres(lat, lon, st.lat, st.lon) }))
        .filter((r) => r.m <= NEAR_RADIUS_M)
        .sort((a, b) => a.m - b.m);
      here.stops.forEach((r) => linesAt(r.stop.id).forEach((line) => here.lines.add(line)));
      const entries = here.stops.slice(0, 3).flatMap((r) => stopLines.get(r.stop.id) || []);
      await Promise.all(entries.map((l) =>
        loadRoute(l.line, l.dir).then((route) => here.routes.set(l.key, route)).catch(() => {})));
    } catch (err) {
      // Without stop data the map simply shows every bus.
    }
    if (nearMe !== here) return;
    here.ready = true;
    render(lastBuses);
    renderArrivals();
  }

  // The nearest stop and the next buses at the three nearest stops, for the empty panel.
  function nearMeCard() {
    if (!nearMe || !nearMe.ready || !nearMe.stops.length) return '';
    const first = nearMe.stops[0];
    const coming = [];
    for (const r of nearMe.stops.slice(0, 3)) {
      for (const c of stopBuses({ stop: r.stop, index: nearMe.index, routes: nearMe.routes })) {
        coming.push(Object.assign({ at: r.stop }, c));
      }
    }
    coming.sort((a, b) => a.minutes - b.minutes);
    const seenBuses = new Set();
    const next = coming.filter((c) => !seenBuses.has(c.bus.id) && seenBuses.add(c.bus.id)).slice(0, 4);
    return '<div class="summary"><div><span class="label">Nearest stop</span><b>' + escapeHtml(first.stop.name) +
      '</b> · ' + walkMinutes(first.m) + ' min walk<small>Lines ' + escapeHtml(linesAt(first.stop.id).join(', ')) +
      '</small></div></div>' +
      (next.length ? '<p class="section">Next buses near you</p>' + next.map((c) =>
        '<button type="button" class="arrival trip" data-bus="' + escapeHtml(c.bus.id) + '">' +
        '<span class="tag">' + escapeHtml(c.bus.line) + '</span>' +
        '<span class="to">' + escapeHtml(c.at.name) + '<small>towards ' + escapeHtml(c.end) + '</small></span>' +
        '<span class="when"><b>' + (c.minutes <= 0 ? 'now' : '~' + c.minutes + ' min') + '</b></span></button>').join('')
        : '<p class="note">No bus is on its way to the stops near you right now.</p>');
  }

  function showMe(p) {
    const at = [p.coords.latitude, p.coords.longitude];
    const radius = Math.min(p.coords.accuracy || 0, 300);
    if (!meMarker) {
      meCircle = L.circle(at, {
        radius, weight: 1, color: '#2f7fe0', fillColor: '#2f7fe0', fillOpacity: 0.1, interactive: false,
      }).addTo(map);
      meMarker = L.marker(at, {
        icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: '<div class="me-dot"></div>' }),
        zIndexOffset: 2400, interactive: false, keyboard: false,
      }).addTo(map);
    } else {
      meMarker.setLatLng(at);
      meCircle.setLatLng(at).setRadius(radius);
    }
    locateButton.classList.remove('off');
    // The first fix centres the map on the user, unless a search already moved it or the
    // user is far from Porto.
    if (!centredOnUser) {
      centredOnUser = true;
      if (!centreOnFix && !trip && !routeView && !stopView && !pinMode &&
          metres(at[0], at[1], 41.1579, -8.6291) < 40000) {
        map.fitBounds([at, at], Object.assign(viewPadding(), { maxZoom: 16 }));
      }
    }
    updateNearMe(at[0], at[1]);
    if (centreOnFix) {
      centreOnFix = false;
      map.fitBounds([at, at], Object.assign(viewPadding(), { maxZoom: Math.max(map.getZoom(), 16) }));
    }
  }

  function watchMe() {
    if (watchId !== null || !navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(showMe, (err) => {
      if (err.code === 1) {
        locateButton.classList.add('off');
        locateButton.title = 'Location access is off';
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
    }, { enableHighAccuracy: true, maximumAge: 10000 });
  }

  // A button on the map that shows where the user is and centres the map there.
  const locateButton = L.DomUtil.create('button', 'locate');
  locateButton.type = 'button';
  locateButton.title = 'Show my location';
  locateButton.setAttribute('aria-label', 'Show my location');
  locateButton.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" ' +
    'd="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.07A7 7 0 0 0 13 5.07V3h-2v2.07A7 7 0 0 0 5.07 11H3v2h2.07A7 7 0 0 0 ' +
    '11 18.93V21h2v-2.07A7 7 0 0 0 18.93 13H21v-2zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>';
  L.DomEvent.disableClickPropagation(locateButton);
  locateButton.addEventListener('click', () => {
    if (meMarker) {
      map.fitBounds([meMarker.getLatLng(), meMarker.getLatLng()], Object.assign(viewPadding(), { maxZoom: Math.max(map.getZoom(), 16) }));
    } else {
      centreOnFix = true;
    }
    watchMe();
  });
  const LocateControl = L.Control.extend({ onAdd: () => locateButton });
  new LocateControl({ position: 'topright' }).addTo(map);

  // Show the dot from the start; the browser asks for permission the first time.
  watchMe();

  // Each tab starts fresh, so results from different searches never show at the same time.
  function setMode(next) {
    if (next === mode && next !== 'pin') return;
    mode = next;
    save('mode', next);
    document.querySelectorAll('[data-mode]').forEach((tab) =>
      tab.setAttribute('aria-selected', String(tab.dataset.mode === next)));
    panel.querySelectorAll('[data-for]').forEach((el) => { el.hidden = el.dataset.for !== next; });
    customOrigin = null;
    clearTrip();
    closeStop();
    destInput.value = '';
    stopList.innerHTML = '';
    busInput.value = '';
    save('bus', '');
    render(lastBuses);
    setPinMode(next === 'pin');
    syncRoute();
  }

  document.querySelectorAll('[data-mode]').forEach((tab) =>
    tab.addEventListener('click', () => setMode(tab.dataset.mode)));

  function trackBus(id) {
    if (pinMode) setPinMode(false);
    busInput.value = id;
    save('bus', id);
    if (panel.hidden) setPanel(true);
    render(lastBuses);
    syncRoute();
  }

  function setPanel(open) {
    panel.hidden = !open;
    panelToggle.setAttribute('aria-expanded', String(open));
    panelToggle.textContent = open ? 'Close' : 'Search';
    save('panel', open ? '1' : '');
    map.invalidateSize();
    if (open) { renderArrivals(); refreshArrivals(); }
  }

  panelToggle.addEventListener('click', () => setPanel(panel.hidden));
  stopInput.addEventListener('input', showSuggestions);
  stopInput.addEventListener('focus', () => { stopInput.select(); showSuggestions(); });
  stopList.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-id]');
    const stop = btn && stops && stops.find((st) => st.id === btn.dataset.id);
    if (stop) { stopInput.blur(); openStop(stop); }
  });
  busInput.addEventListener('input', () => {
    save('bus', busInput.value.trim());
    render(lastBuses);
    syncRoute();
    const q = busQuery();
    const onLine = lastBuses.filter((b) => b.line.toUpperCase() === q);
    if (onLine.length && !lastBuses.some((b) => b.id.toUpperCase() === q)) {
      map.fitBounds(onLine.map((b) => [b.lat, b.lon]), Object.assign(viewPadding(30), { maxZoom: 15 }));
    }
  });
  arrivalsEl.addEventListener('click', (e) => {
    if (e.target.closest('[data-clear-stop]')) {
      closeStop();
      render(lastBuses);
      renderArrivals();
      return;
    }
    const pinAction = e.target.closest('[data-pin]');
    if (pinAction && pinMode) {
      const point = pinTarget();
      if (pinAction.dataset.pin === 'to') {
        setPinMode(false);
        startTripTo(point);
      } else {
        // The pin stays out so the destination can be picked next.
        setOrigin(point);
      }
      return;
    }
    if (e.target.closest('[data-clear-origin]')) {
      customOrigin = null;
      tripLayer.clearLayers();
      renderArrivals();
      return;
    }
    if (e.target.closest('[data-clear-trip]')) {
      customOrigin = null;
      clearTrip();
      closeStop();
      render(lastBuses);
      destInput.value = '';
      renderArrivals();
      return;
    }
    if (e.target.closest('[data-origin-centre]') && trip && trip.dest) {
      const c = map.getCenter();
      trip.origin = { lat: c.lat, lon: c.lng };
      planTrip(trip);
      return;
    }
    const place = e.target.closest('[data-place]');
    if (place && trip) { chooseDestination(trip, Number(place.dataset.place)); return; }
    const changePick = e.target.closest('[data-change]');
    if (changePick && trip && trip.results) {
      const c = trip.results.changes[Number(changePick.dataset.change)];
      if (c) {
        selectStop(c.board, false);
        trackBus(c.bus.id);
      }
      return;
    }
    const pick = e.target.closest('[data-trip]');
    if (pick && trip && trip.results) {
      const r = trip.results.found[Number(pick.dataset.trip)];
      if (r) {
        selectStop(r.boardStop, false);
        trackBus(r.bus.id);
      }
      return;
    }
    if (e.target.closest('[data-clear]')) {
      busInput.value = '';
      save('bus', '');
      render(lastBuses);
      syncRoute();
      return;
    }
    const row = e.target.closest('button.arrival');
    if (!row) return;
    if (row.dataset.bus) { trackBus(row.dataset.bus); return; }
    const stop = routeView && routeView.data && routeView.data.stops.find((s) => s.id === row.dataset.stop);
    if (stop) selectStop(stop, false);
  });

  lineButton.addEventListener('click', () => setLinePicker(linePicker.hidden));
  linePicker.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-line]');
    if (!chip) return;
    selectedLine = chip.dataset.line;
    save('line', selectedLine);
    updateLineButton();
    setLinePicker(false);
    render(lastBuses);
    // Bring the chosen line's buses into view.
    const onLine = lastBuses.filter((b) => b.line === selectedLine);
    if (onLine.length) map.fitBounds(onLine.map((b) => [b.lat, b.lon]), Object.assign(viewPadding(30), { maxZoom: 15 }));
  });
  // Close the picker on a click elsewhere or on Escape.
  document.addEventListener('click', (e) => {
    if (!linePicker.hidden && !linePicker.contains(e.target) && !lineButton.contains(e.target)) setLinePicker(false);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !linePicker.hidden) setLinePicker(false); });

  const savedBus = load('bus');
  const savedMode = load('mode');
  setMode(['address', 'stop', 'bus'].includes(savedMode) ? savedMode : 'address');
  if (mode === 'bus') busInput.value = savedBus;
  if (load('panel')) setPanel(true);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { refresh(); if (!panel.hidden) refreshArrivals(); }
  });
  setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
  setInterval(() => { if (!document.hidden && !panel.hidden) refreshArrivals(); }, ARRIVALS_REFRESH_MS);
  setInterval(() => { if (!document.hidden) refreshAnchors(); }, ROUTE_REFRESH_MS);
  refresh();
</script>
</body>
</html>
